version: 2
updates:
  # 主题与依赖以上游 CuteLeaf/Firefly 为准（见 docs/upstream.md）。
  # 这里只收 patch 级修复/安全更新；minor 与 major 跟随上游提交，不单独接受。
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
    pull-request-branch-name:
      separator: "-"
    ignore:
      # 顺序有意义：任何一条匹配即忽略，具体规则要写在通配规则之前。
      # @mermanjs/web 是 0.x：0.9.2 移除了 assertSafeSvgForDom 导出与 pkg/*.wasm 子路径，
      # 属于 semver 允许的 0.x minor breaking（曾让 PR 构建直接失败），连 patch 也不自动升。
      - dependency-name: "@mermanjs/web"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    pull-request-branch-name:
      separator: "-"
